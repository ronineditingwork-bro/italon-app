# Отдельная страница для сотрудников (GitHub Pages). Сама программа зашифрована паролем (app/index.html).
# Раз в сутки забирает с italon-x2.ru свежий каталог и новые фото — они и так открыты на сайте.
name: Site
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: media
          key: media-${{ github.run_id }}
          restore-keys: media-
      - name: Catalog and photos
        run: |
          set -euo pipefail
          mkdir -p _site/data media
          if curl -fsSL --connect-timeout 15 --max-time 60 --retry 3 -o catalog.new https://italon-x2.ru/data/catalog.json && [ "$(jq '.products | length' catalog.new)" -gt 500 ]; then cp catalog.new media/catalog.json; fi
          cp media/catalog.json _site/data/catalog.json
          jq -r '.products[].image.src // empty' _site/data/catalog.json | sort -u | grep -E '^media/[A-Za-z0-9_/-]+\.(webp|jpe?g|png)$' > list.txt
          while read -r f; do
            if [ ! -s "$f" ]; then mkdir -p "$(dirname "$f")"; echo "$f"; fi
          done < list.txt > todo.txt
          wc -l < todo.txt
          timeout 360 xargs -r -P 8 -a todo.txt -I{} sh -c 'curl -fsSL --connect-timeout 10 --max-time 30 --retry 1 -o "{}.part" "https://italon-x2.ru/{}" && mv "{}.part" "{}" || true' || true
          find media -name '*.part' -delete
          cp -r app index.html robots.txt _site/
          while read -r f; do
            if [ -s "$f" ]; then mkdir -p "_site/$(dirname "$f")"; cp "$f" "_site/$f"; fi
          done < list.txt
          echo "photos: $(find _site/media -type f | wc -l) of $(wc -l < list.txt)"
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
