# Отдельная страница для сотрудников (GitHub Pages). Сама программа зашифрована паролем (app/index.html).
# Раз в сутки забирает с italon-x2.ru свежий каталог и новые фото — они и так открыты на сайте.
name: Site
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: media
          key: media-${{ github.run_id }}
          restore-keys: media-
      - name: Catalog and photos
        run: |
          set -euo pipefail
          mkdir -p _site/data media
          curl -fsSL --retry 4 -o _site/data/catalog.json https://italon-x2.ru/data/catalog.json
          test "$(jq '.products | length' _site/data/catalog.json)" -gt 500
          jq -r '.products[].image.src // empty' _site/data/catalog.json | sort -u | grep -E '^media/[A-Za-z0-9_/-]+\.(webp|jpe?g|png)$' > list.txt
          while read -r f; do
            if [ ! -s "$f" ]; then mkdir -p "$(dirname "$f")"; echo "$f"; fi
          done < list.txt > todo.txt
          xargs -r -P 6 -I{} sh -c 'curl -fsSL --retry 3 -o "{}.part" "https://italon-x2.ru/{}" && mv "{}.part" "{}" || true' < todo.txt
          find media -name '*.part' -delete
          cp -r app index.html robots.txt _site/
          while read -r f; do
            if [ -s "$f" ]; then mkdir -p "_site/$(dirname "$f")"; cp "$f" "_site/$f"; fi
          done < list.txt
          echo "photos: $(find _site/media -type f | wc -l) of $(wc -l < list.txt)"
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
